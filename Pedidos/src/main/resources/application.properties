spring.application.name=Pedidos
server.port=8801

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/bd_pedidos
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:sql}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

eureka.instance.prefer-ip-address=true

jwt.secret=PannacottaClaveSecretaCompartidaEntreMicroserviciosDebeSerLarga2026


management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}