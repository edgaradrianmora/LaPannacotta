@if (auth.logueado()) {
  <header class="barra">
    <a class="marca" routerLink="/inicio" aria-label="La Pannacotta, ir al inicio">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M5 30c0-9 6.5-16 15-16s15 7 15 16z" fill="#fbdde6" stroke="#b8174f" stroke-width="2" stroke-linejoin="round"/>
        <path d="M11 22c2 1 3 3 3 5M19 20c2 1.5 2.5 4 2.5 7M27 22c1.5 1 2.5 3 2.5 5" stroke="#b8174f" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="20" cy="9" r="3.5" fill="#b8174f"/>
        <path d="M5 33h30" stroke="#3f7a56" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span>La Pannacotta</span>
    </a>
    <nav aria-label="Principal">
      <a routerLink="/inicio" routerLinkActive="activo">Inicio</a>
      <a routerLink="/productos" routerLinkActive="activo">Productos</a>
      <a routerLink="/pedidos" routerLinkActive="activo">Pedidos</a>
      <a routerLink="/delivery" routerLinkActive="activo">Delivery</a>
    </nav>
    <div class="sesion">
      <span class="avatar" aria-hidden="true">{{ auth.usuario()?.username?.charAt(0)?.toUpperCase() }}</span>
      <span class="quien">{{ auth.usuario()?.username }}</span>
      <button class="btn btn-borde btn-chico" (click)="auth.logout()">Cerrar sesión</button>
    </div>
  </header>
}
<main class="contenido">
  <router-outlet />
</main>
