# DESPLIEGUE / ENTREGA CONTINUA (CD)
# Se ejecuta SOLO cuando el workflow "CI" termina en verde sobre la rama main.
# Construye la imagen Docker de cada servicio y la publica en GitHub Container Registry (ghcr.io).
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:              # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read
  packages: write                 # permite publicar imágenes con el GITHUB_TOKEN

jobs:
  imagenes:
    name: Imagen Docker - ${{ matrix.servicio }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [Eureka, Gateway, Auth, Productos, Pedidos, Delivery]
    steps:
      - name: Descargar el código del commit que pasó CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Preparar nombre de la imagen (ghcr exige minúsculas)
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGEN=pannacotta-$(echo '${{ matrix.servicio }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGEN }}:latest
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGEN }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
